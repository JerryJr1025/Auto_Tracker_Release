name: Import Auto Tracker 0.0.6 Alpha Test Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-0.0.6-alpha-test-release.yml

permissions:
  contents: write

jobs:
  import-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download validated release artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/release-artifact.zip 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-99bc-81fa-aa94-08a05d495b81/raw?se=2026-09-06T20%3A17%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=790c3eb6-d0be-5bab-bd50-036f70c3dffb&skoid=0556a536-9b18-4aa8-bae0-70ed682ee936&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T03%3A14%3A38Z&ske=2026-09-07T03%3A14%3A38Z&sks=b&skv=2026-02-06&sig=u/6%2B09BkcteTLfxb8LgKmed6r9Uo3qL0ix9Z8BisfMA%3D'
          rm -rf /tmp/auto-tracker-release
          mkdir -p /tmp/auto-tracker-release
          unzip -q /tmp/release-artifact.zip -d /tmp/auto-tracker-release

      - name: Install release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'UI Controller/Windows' 'UI Controller/Linux' 'Tampermonkey Script'
          cp /tmp/auto-tracker-release/Auto_Tracker_Windows_0.0.6_Alpha.zip 'UI Controller/Windows/'
          cp /tmp/auto-tracker-release/Auto_Tracker_Linux_0.0.6_Alpha.zip 'UI Controller/Linux/'
          cp /tmp/auto-tracker-release/tampermonkey.meta.js 'Tampermonkey Script/'
          cp /tmp/auto-tracker-release/tampermonkey.user.js 'Tampermonkey Script/'

          cat > 'UI Controller/Windows/README.md' <<'EOF'
          # Auto Tracker Windows 0.0.6 Alpha

          First-time test release.

          1. Download `Auto_Tracker_Windows_0.0.6_Alpha.zip`.
          2. Extract the entire ZIP.
          3. Run `Auto_Tracker.bat`.
          4. Follow the first-time setup prompts for Node.js, npm/ExcelJS, and Tampermonkey.
          EOF

          cat > 'UI Controller/Linux/README.md' <<'EOF'
          # Auto Tracker Linux 0.0.6 Alpha

          First-time test release.

          1. Download `Auto_Tracker_Linux_0.0.6_Alpha.zip`.
          2. Extract the entire ZIP.
          3. Keep `Auto_Tracker.sh` and `Auto_Tracker.bat` together; the current Linux launcher depends on the BAT file.
          4. Ensure Node.js, npm, and Python 3 are installed.
          5. Run `chmod +x Auto_Tracker.sh` and then `./Auto_Tracker.sh`.
          EOF

      - name: Verify published packages
        shell: bash
        run: |
          set -euo pipefail
          unzip -t 'UI Controller/Windows/Auto_Tracker_Windows_0.0.6_Alpha.zip' >/dev/null
          unzip -t 'UI Controller/Linux/Auto_Tracker_Linux_0.0.6_Alpha.zip' >/dev/null
          grep -q '^// @version 0.0.6$' 'Tampermonkey Script/tampermonkey.user.js'
          grep -q 'Auto_Tracker_Release/main/Tampermonkey%20Script/tampermonkey.meta.js' 'Tampermonkey Script/tampermonkey.user.js'
          grep -q 'Auto_Tracker_Release/main/Tampermonkey%20Script/tampermonkey.user.js' 'Tampermonkey Script/tampermonkey.user.js'
          cmp <(sed -n '/^\/\/ ==UserScript==$/,/^\/\/ ==\/UserScript==$/p' 'Tampermonkey Script/tampermonkey.user.js') 'Tampermonkey Script/tampermonkey.meta.js'
          echo 'Release verification OK'

      - name: Commit first public test release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-0.0.6-alpha-test-release.yml
          git add 'UI Controller/Windows' 'UI Controller/Linux' 'Tampermonkey Script'
          git commit -m 'Publish Auto Tracker 0.0.6 Alpha test release'
          git push origin HEAD:main
